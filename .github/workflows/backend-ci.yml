name: backend-ci
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install pipenv
        working-directory:./backend
      - run: pipenv install --dev || pip install -r requirements.txt || true
        working-directory:./backend