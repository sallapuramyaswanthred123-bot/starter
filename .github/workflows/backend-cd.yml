name: Backend Continuous Deployment

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - working-directory:./backend
        run: |
          pip install pipenv
          sudo apt-get update && sudo apt-get install -y python3-dev build-essential
          pipenv install --dev --skip-lock
          pipenv run flake8

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - working-directory:./backend
        run: |
          pip install pipenv
          sudo apt-get update && sudo apt-get install -y python3-dev build-essential
          pipenv install --dev --skip-lock
          pipenv run test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v3
      - name: Build and Push
        working-directory:./backend
        run: docker build --tag=${{ secrets.AWS_ECR_REGISTRY }}/backend:${{ github.sha }}.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1
      - name: Push to ECR
        run: docker push ${{ secrets.AWS_ECR_REGISTRY }}/backend:${{ github.sha }}
      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --name cluster --region ${{ secrets.AWS_REGION }}
          cd backend/k8s
          kustomize edit set image backend=${{ secrets.AWS_ECR_REGISTRY }}/backend:${{ github.sha }}
          kustomize build | kubectl apply -f -