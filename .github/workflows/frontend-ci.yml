name: frontend-ci
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install
        working-directory:./frontend
        run: npm ci
      - name: Build
        working-directory:./frontend
        run: npm run build