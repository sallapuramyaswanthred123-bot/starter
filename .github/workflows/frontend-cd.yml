name: Frontend Continuous Deployment

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - working-directory:./frontend
        run: |
          npm ci
          npm run lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - working-directory:./frontend
        run: |
          npm ci
          npm test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Build image
        working-directory:./frontend
        run: |
          npm ci
          npm run build
          docker build --build-arg=REACT_APP_MOVIE_API_URL=${{ secrets.REACT_APP_MOVIE_API_URL }} --tag=${{ secrets.AWS_ECR_REGISTRY }}/frontend:${{ github.sha }}.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1
      - name: Push to ECR
        run: docker push ${{ secrets.AWS_ECR_REGISTRY }}/frontend:${{ github.sha }}
      - name: Deploy to EKS
        run: |
          aws eks update-kubeconfig --name cluster --region ${{ secrets.AWS_REGION }}
          cd frontend/k8s
          kustomize edit set image frontend=${{ secrets.AWS_ECR_REGISTRY }}/frontend:${{ github.sha }}
          kustomize build | kubectl apply -f -