name: Frontend Continuous Deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v1
      - run: docker build -t frontend./frontend
      - run: docker tag frontend ${{ secrets.AWS_ECR_REGISTRY }}/frontend:latest
      - run: docker push ${{ secrets.AWS_ECR_REGISTRY }}/frontend:latest
      - run: aws eks update-kubeconfig --name cluster --region us-east-1
      - run: kubectl set image deployment/frontend frontend=${{ secrets.AWS_ECR_REGISTRY }}/frontend:latest