name: Frontend Continuous Deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory:./frontend
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm ci
      - run: npm run lint
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory:./frontend
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 18
      - run: npm ci
      - run: npm test
  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v3
      - uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
      - uses: aws-actions/amazon-ecr-login@v1
        id: login-ecr
      - run: |
          docker build -t ${{ steps.login-ecr.outputs.registry }}/frontend:latest./frontend
          docker push ${{ steps.login-ecr.outputs.registry }}/frontend:latest
      - run: aws eks update-kubeconfig --name cluster --region us-east-1
      - run: |
          cd frontend/k8s
          kustomize edit set image frontend=${{ steps.login-ecr.outputs.registry }}/frontend:latest
          kustomize build | kubectl apply -f -